<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/plantilla/plantilla.xhtml">

    <ui:define name="titulo">Menu</ui:define>
    <ui:define name="subtitulo">Selecciona una seccion para comenzar</ui:define>

    <ui:define name="contenido">
        <style>
            .tarjetas{
                display: flex;
                gap: 30px;
                flex-wrap: wrap;
                justify-content: center;
                padding: 20px 0;
            }
            .tarjeta{
                width: 230px;
                height: 320px;
                background: #FFFFFF;
                border-radius: 14px;
                text-decoration: none;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 30px 24px;
                box-sizing: border-box;
                box-shadow: 0px 2px 8px rgba(0,0,0,0.12);
            }
            .tarjeta:hover{
                box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
            }
            .tarjeta .icono{
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .tarjeta .icono-img{
                width: 90px;
                height: 90px;
                object-fit: contain;
            }
            .tarjeta .nombre{
                font-size: 17px;
                font-weight: bold;
                color: #1B1B1B;
                margin: 0;
                text-align: left;
            }
        </style>

        <div class="tarjetas">
            <h:link outcome="registroProfesores" styleClass="tarjeta">
                <div class="icono">
                    <p:graphicImage url="resources/images/icono-profesores.png" styleClass="icono-img" />
                </div>
                <p class="nombre">Alta de profesores</p>
            </h:link>

            <h:link outcome="unidades" styleClass="tarjeta">
                <div class="icono">
                    <p:graphicImage url="resources/images/icono-unidades.png" styleClass="icono-img" />
                </div>
                <p class="nombre">Unidades de aprendizaje</p>
            </h:link>

            <h:link outcome="asignaciones" styleClass="tarjeta">
                <div class="icono">
                    <p:graphicImage url="resources/images/icono-asignaciones.png" styleClass="icono-img" />
                </div>
                <p class="nombre">Asignaciones</p>
            </h:link>

            <h:link outcome="consulta" styleClass="tarjeta">
                <div class="icono">
                    <p:graphicImage url="resources/images/icono-consulta.png" styleClass="icono-img" />
                </div>
                <p class="nombre">Consulta general</p>
            </h:link>
        </div>
    </ui:define>

</ui:composition>
</html>
