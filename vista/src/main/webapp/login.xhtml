<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUAP</title>
    <style>

        html, body{
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body{
            background-color: #76BB63;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        }

        .contenedor{
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        div.login{
            width: 420px;
            padding: 45px 50px 40px;
            background: #F2F2F0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
            text-align: center;
            box-sizing: border-box;
        }

        .titulo{
            margin: 0 0 32px;
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #AFB56C 0%, #7FAC5B 45%, #4E8B3F 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #6FA254;
        }

        .form-group{
            margin-bottom: 18px;
        }

        .campo{
            width: 100%;
            box-sizing: border-box;
            padding: 13px 16px;
            border: 1px solid #4F4F4F;
            border-radius: 10px;
            background: #FFFFFF;
            font-size: 15px;
            color: #333333;
            font-family: inherit;
            box-shadow: none;
        }

        .campo::placeholder{
            color: #9A9A9A;
        }

        .campo:focus{
            outline: none;
            border-color: #3E7B3E;
        }

        .boton{
            margin-top: 10px;
            padding: 12px 30px;
            background: #3E7B3E;
            border: none;
            border-radius: 22px;
            box-shadow: none;
        }

        .boton .ui-button-text{
            color: #FFFFFF;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            font-style: italic;
            padding: 0;
        }

        .boton:hover{
            background: #336633;
        }

        .ui-messages{
            width: 420px;
            margin: 0 auto 14px;
        }
    </style>
</h:head>

<h:body>
    <div class="contenedor">

        <h:form>

            <p:messages id="messages" showDetail="true" closable="true">

            </p:messages>
            <div class="login">
                <div class="panel-header">
                    <h1 class="titulo">SAUAP</h1>
                </div>
                <div class="panel-body">
                    <div class="form-group">
                        <p:inputText styleClass="campo" placeholder="Nombre:" autocomplete="false" value="#{loginUI.usuario.usuario}" />
                    </div>
                    <div class="form-group">
                        <p:password styleClass="campo" placeholder="Contraseña:" value="#{loginUI.usuario.contrasena}" />
                    </div>
                    <p:commandButton update="messages" styleClass="boton" value="Iniciar sesión" actionListener="#{loginUI.login()}" />

                </div>
            </div>

        </h:form>

    </div>

</h:body>
</html>
