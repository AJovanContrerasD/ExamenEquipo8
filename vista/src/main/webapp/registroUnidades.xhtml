<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <ui:define name="titulo"> Registro de unidades </ui:define>
    <ui:define name="subtitulo"> Registro de unidades </ui:define>

    <ui:define name="contenido">
        <h:form>

            <p:messages id="messages" showDetail="true" closable="true">

            </p:messages>

            <div id="datos">
                <div>
                    <p:inputText styleClass="fieldLarge" placeholder="Nombre de la unidad de aprendizaje" maxlength="50" autocomplete="false" required="true" value="#{unidadUI.unidad.nombre}"> </p:inputText>
                </div>

                <div class="filaTriple">
                    <p:inputText styleClass="fieldSmall" type="number" placeholder="Horas de clase" autocomplete="false" required="true" value="#{unidadUI.unidad.horasClase}"> <f:validateLongRange minimum="0" maximum="4" /> </p:inputText>
                    <p:inputText styleClass="fieldSmall" type="number" placeholder="Horas de taller" autocomplete="false" required="true" value="#{unidadUI.unidad.horasTaller}"> <f:validateLongRange minimum="0" maximum="4" /> </p:inputText>
                    <p:inputText styleClass="fieldSmall" type="number" placeholder="Horas de laboratorio" autocomplete="false" required="true" value="#{unidadUI.unidad.horasLaboratorio}"> <f:validateLongRange minimum="0" maximum="4" /> </p:inputText>
                </div>

                <p:commandButton update="messages" id="btnAgregar" value="Registrar unidad de aprendizaje" actionListener="#{unidadUI.registrar()}"> </p:commandButton>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
