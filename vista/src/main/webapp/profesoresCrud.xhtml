<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title> <ui:insert name="titulo"> SAUAP </ui:insert> </title>
    <style>
        body{
            font-family: Arial;
            background-color: #4F9D69;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        header{
            display: flex;
            align-items: center;
            width: 100%;
            height: 80px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
            background-color: #FFFDF9;
            position: relative;
            z-index: 10;
        }
        #titleDiv{
            padding-left: 2%;
        }
        #menu{
            padding-left: 2%;
        }
        #titulo{
            text-align: left;
            font-size:25px;
            font-weight: bold;
            background: -webkit-linear-gradient(270deg, #29c551, #8effc1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #subtitulo{
            font-size:16px;
            text-align: left;
            font-weight: normal;
            color: #5da180;
        }
        #btnMenu{
            width: 30px;
            height: 30px;
        }
        #contenedorPrincipal{
            display: flex;
            min-height: calc(100vh - 80px);
        }
        #sidebar{
            width: 200px;
            background-color: #4FA974;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }
        #sidebar.hidden{
            margin-left: -230px;
        }
        #sidebar button{
            padding: 8px;
            margin-bottom: 14px;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            background-color: #FFFDF9;
            color: #21bd6e;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.25);
            transition: 0.2s;
        }
        #sidebar button:hover{
            background-color: #f6f6f6;
            color: #4FA974;
            transform: translateY(-2px);
        }
        #contenido{
            flex: 1;
            padding: 20px;
            overflow: auto;
            background-color: #F7F9F4;
        }
        #datos{
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 18px;
            padding: 4% 15%;
        }
        .filaDoble{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .filaTriple{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        .fieldLarge{
            width: 100%;
            height: 35px;

            border: 2px solid #bfbfbf;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.01);
            border-radius: 15px;
            font-size: 15px;
        }
        .fieldSmall,
        .fieldSelect{
            width: 100%;
            flex: 1;
            height: 35px;
            border-radius: 15px;
            border: 2px solid #bfbfbf;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.01);
            font-size: 14px;
        }
        #btnAgregar{
            background-color: #4FA974;
            color: white;
            height: 40px;
            border-radius: 25px;
            font-size: 18px;
            transition: 0.2s;
            border: none;
            margin-left: 20%;
            margin-right: 20%;

        }

        #btnAgregar:hover{
            background-color: #3dd666;
            transform: translateY(-2px);
            cursor: pointer;
        }
    </style>
    <script>
        function abrirSidebar(){
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }
    </script>
</h:head>
<h:body>
<header>
    <div id="menu"> <button id="btnMenu" onclick="abrirSidebar()"> </button> </div>
    <div id="logo"> </div>
    <div id="titleDiv">
        <div id="titulo"> SAUAP </div>
        <div id="subtitulo"> <ui:insert name="subtitulo"> Subtitulo </ui:insert> </div>
    </div>
</header>

<div id="contenedorPrincipal">
<div id="sidebar">
    <button type="button" id="seccion" onclick="window.location.href=''"> Inicio </button>
    <button type="button" id="seccion" onclick="window.location.href='profesoresCrud.xhtml'"> Profesores </button>
    <button type="button" id="seccion" onclick="window.location.href=''"> Materias </button>
    <button type="button" id="seccion" onclick="window.location.href=''"> Asignaciones </button>
</div>
<div id="contenido">
<ui:insert name="contenido">
    <style>
        body {
            margin: 0;
            background-color: #55b340;
            font-family: Arial, sans-serif;
        }

        .head {
            background-color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .head img {
            height: 60px;
        }

        .head-titles {
            display: flex;
            flex-direction: column;
        }

        .head h1 {
            margin: 0;
            color: #5bb343;
            font-size: 32px;
            font-weight: bold;
        }

        .head h3 {
            margin: 0;
            color: #3b732b;
            font-size: 20px;
            font-weight: normal;
        }

        .card {
            background-color: #f7fdf4;
            width: 90%;
            margin: 30px auto;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-height: 500px;
            box-sizing: border-box;
        }

        .busqueda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .busq {
            flex-grow: 1;
            padding: 10px 15px 10px 40px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-image: url('resources/search-icon.png');
            background-repeat: no-repeat;
            background-position: 12px center;
            background-size: 18px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-registrar {
            background-color: #00aa4f;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .box-modificar {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #bce2a8;
            margin-bottom: 20px;
        }

        .tabla {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        .tabla th {
            text-align: center;
            background-color: #d1f7be;
            color: #3f782c;
            padding: 12px;
            border: 2px solid #a2e283;
            font-size: 16px;
            font-weight: bold;
        }

        .tabla td {
            text-align: center;
            padding: 12px;
            border: 2px solid #a2e283;
            color: #555555;
            font-weight: bold;
            font-size: 16px;
        }

        .acciones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-icono {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .btn-icono img {
            width: 24px;
            height: 24px;
        }
    </style>


    <div class="head">
        <h:graphicImage url="resources/imagen.png" />
        <div class="head-titles">
            <h1>SAUAP</h1>
            <h3>Gestion de profesores</h3>
        </div>
    </div>

    <div class="card">
        <h:form id="formProfesor">

            <div class="busqueda">
                <h:inputText styleClass="busq" value="#{profesorBean.filtroBusqueda}" placeholder="Buscar..."/>
                <h:commandButton value="Buscar" styleClass="btn-registrar" action="#{profesorBean.buscar()}" />
            </div>

            <h:panelGroup id="boxEdicion" rendered="#{profesorBean.profesorSeleccionado != null}" layout="block" styleClass="box-modificar">
                <h3>Modificar un profesor</h3>

                <h:panelGrid columns="2">
                    <h:outputLabel value="Nombre :"/>
                    <h:inputText value="#{profesorBean.profesorSeleccionado.nombre}"/>

                    <h:outputLabel value="Apellido paterno:"/>
                    <h:inputText value="#{profesorBean.profesorSeleccionado.appaterno}"/>

                    <h:outputLabel value="Apellido Materno:"/>
                    <h:inputText value="#{profesorBean.profesorSeleccionado.apmaterno}"/>

                    <h:outputLabel value="RFC:"/>
                    <h:inputText value="#{profesorBean.profesorSeleccionado.rfc}" />
                </h:panelGrid>


                <br/>
                <h:commandButton value="Guardar cambios" action="#{profesorBean.guardarEdicion()}" />
                <h:commandButton value="Cancelar" action="#{profesorBean.cancelarEdicion()}" style="margin-left: 10px;" />
            </h:panelGroup>

            <h:dataTable value="#{profesorBean.listaProfesores}" var="prof" styleClass="tabla">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="##{prof.idprofesor}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Nombre</f:facet>
                    <h:outputText value="#{prof.nombre}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Apellido Paterno</f:facet>
                    <h:outputText value="#{prof.appaterno}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Apellido Materno</f:facet>
                    <h:outputText value="#{prof.apmaterno}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">RFC</f:facet>
                    <h:outputText value="#{prof.rfc}"/>
                </h:column>

                <h:column>
                    <f:facet name="header"></f:facet>
                    <div class="acciones">
                        <h:commandLink action="#{profesorBean.setProfesorSeleccionado(prof)}" styleClass="btn-icono">
                            <h:graphicImage url="resources/edit-icon.png"/>
                        </h:commandLink>
                        <h:commandLink action="#{profesorBean.elim(prof)}" onclick="return confirm('Seguro de eliminarlo?');" styleClass="btn-icono">
                            <h:graphicImage url="resources/elimin-icon.png"/>
                        </h:commandLink>
                    </div>
                </h:column>
            </h:dataTable>

        </h:form>
    </div>
</ui:insert>
</div>
</div>

</h:body>
</html>
