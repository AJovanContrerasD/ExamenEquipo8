<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <ui:define name="titulo"> Asignacion a Unidades de Aprendizajes  </ui:define>
    <ui:define name="subtitulo"> A docentes registrados </ui:define>


    <ui:define name="contenido">
        <link rel="stylesheet" type="text/css" href="resources/style.css" />
        <main class="contenedorPrincipal">
            <h:form id="formularioAsignacion">
                <p:messages id="messages" showDetail="true" closable="true"/>
                <div class="Separador">

                    <div class="columna">



                        <p:selectOneRadio id="GrupoMateria" value="#{AsignarUI.idUnidadElegida}" layout="custom">
                            <f:selectItems value="#{AsignarUI.listaUnidades}" var="unidad" itemValue="#{unidad.id}" itemLabel="#{unidad.nombre}"/>
                        </p:selectOneRadio>


                    <h5>Unidades de Aprendizaje</h5>
                              <div class="carta">
                            <table id="tablaUnidades" class="datosTabla">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre Unidad</th>
                                    <th>H. Taller</th>
                                    <th>H. Lab</th>
                                    <th>H. Clase</th>
                                    <th>Selecc.</th>
                                </tr>
                                </thead>


                                <tbody>
                                <ui:repeat value="#{AsignarUI.listaUnidades}" var="UnidadAprendizaje" varStatus="status">
                                    <tr>
                                        <td class="centro">
                                            <h:outputText value="#{UnidadAprendizaje.id}"/>
                                        </td>
                                        <td class="centro">
                                            <h:outputText value="#{UnidadAprendizaje.nombre}"/>
                                        </td>

                                        <td>
                                            <h:outputText value="#{UnidadAprendizaje.horastaller}"/>
                                        </td>


                                        <td>
                                            <h:outputText value="#{UnidadAprendizaje.horaslaboratorio}"/>
                                        </td>


                                        <td>
                                            <h:outputText value="#{UnidadAprendizaje.horasclase}"/>

                                        </td>
                                        <td>
                                            <p:radioButton for="@form:GrupoMateria" itemIndex="#{status.index}"/>

                                        </td>

                                    </tr>
                                </ui:repeat>
                                </tbody>
                                  </table>


                              </div>
                        <div class="columna">

                            <p:selectOneRadio id="GrupoProfesor" value="#{AsignarUI.idProfesorElegido}" layout="custom">
                                <f:selectItems value="#{AsignarUI.listaProfesores}" var="profesor" itemValue="#{profesor.id}" itemLabel="#{profesor.nombre}"/>
                            </p:selectOneRadio>


                            <h5>Profesores Activos</h5>
                            <table id="tablaProf" class="datosTabla">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre Profesor</th>
                                    <th>Selecc.</th>
                                </tr>
                                </thead>


                                <tbody>
                                <ui:repeat value="#{AsignarUI.listaProfesores}" var="profesor" varStatus="status">
                                    <tr>
                                        <td class="centro">
                                            <h:outputText value="#{profesor.id}"/>
                                        </td>
                                        <td class="centro">
                                            <h:outputText value="#{profesor.nombre}"/>
                                        </td>




                                        <td>
                                            <p:radioButton for="@form:GrupoProfesor" itemIndex="#{status.index}"/>

                                        </td>

                                    </tr>
                                </ui:repeat>
                                </tbody>
                            </table>
                        </div>
                    </div>


                </div>

                        <div class="btnGuardar">
                        <h:commandButton value="registrarAsignacion" action="#{AsignarUI.guardarAsignacion}" style="
                        background-color: #ffcd50;
                        color: white;
                        font-weight: bold;
                        padding: 10px 20px;"/>
                        </div>
                <div id="cuadroExtra">
                    <div id="cuadroExtraIzquierda">
                    <br/>
                    <br/><br/>
                    <div class="campoFormu">
                        <label>Grupo:</label>
                        <br/>
                        <p:inputText styleClass="fieldLarge" placeholder="Grupo" maxlength="50" autocomplete="false" required="true" value="#{AsignarUI.asignacion.grupo}"/>
                    </div>

                    <div class="campoFormu">
                        <p:outputLabel for="periodo" value="Periodo:" />
                        <p:inputText id="periodo" styleClass="fieldLarge" placeholder="Periodo" maxlenght="10" value="#{AsignarUI.asignacion.semestre}"
                        />
                    </div>

                    <div class="campoFormu">
                        <p:outputLabel value="Dias de la semana" />
                        <p:selectOneRadio value="#{AsignarUI.diaSeleccionado}" layout="grid" columns="3">
                        <f:selectItem itemLabel="Lunes" itemValue="Lunes" />
                        <f:selectItem itemLabel="Martes" itemValue="Martes" />
                            <br/>
                        <f:selectItem itemLabel="Miercoles" itemValue="Miercoles" />
                        <f:selectItem itemLabel="Jueves" itemValue="Jueves" />
                        <f:selectItem itemLabel="Viernes" itemValue="Viernes" />
                        </p:selectOneRadio>

                    </div>
                    </div>

                    <div id="cuadroExtraDerecha">
                    <div id="horasInicioFInal">
                        <div class="columnaHoras">
                    <p:outputLabel for="hinicio" value="Hora Inicio: " />
                        <p:datePicker id="hinicio" value="#{AsignarUI.asignacion.horainicio}" timeOnly="true" pattern="HH:mm"
                                      stepMinute="60" required="true"/>
                        </div>
                        <div class="columnaHoras">
                        <p:outputLabel for="hfin" value="Hora Fin: " />
                        <p:datePicker id="hfin" value="#{AsignarUI.asignacion.horafin}" timeOnly="true" pattern="HH:mm" stepMinute="60"
                                      required="true"/>
                        </div>
                    </div>
                    </div>

                </div>


            </h:form>
        </main>


    </ui:define>
</ui:composition>
