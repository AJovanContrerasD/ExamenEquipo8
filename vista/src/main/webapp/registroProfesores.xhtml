<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <ui:define name="titulo"> Registro de profesores </ui:define>
    <ui:define name="subtitulo"> Registro de profesores </ui:define>

    <ui:define name="contenido">
        <h:form>

        <p:messages id="messages" showDetail="true" closable="true">

        </p:messages>

        <div id="datos">
            <div>
                <p:inputText styleClass="fieldLarge" placeholder="Nombre(s)" maxlength="50" autocomplete="false" required="true" value="#{regProfesorUI.profesor.nombre}"> </p:inputText>
            </div>

            <div class="filaDoble">
                <p:inputText styleClass="fieldSmall" placeholder="Apellido Paterno" maxlength="50" autocomplete="false" required="true" value="#{regProfesorUI.profesor.appaterno}"> </p:inputText>
                <p:inputText styleClass="fieldSmall" placeholder="Apellido Paterno" maxlength="50" autocomplete="false" required="true" value="#{regProfesorUI.profesor.apmaterno}"> </p:inputText>
            </div>

            <div>
                <p:inputText styleClass="fieldLarge" placeholder="RFC" maxlength="13" autocomplete="false" required="true" value="#{regProfesorUI.profesor.rfc}">
                    <f:validateRegex pattern="(?iu)[A-Z&amp;Ñ]{3,4}[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])[A-Z0-9]{3}"/> </p:inputText>
            </div>

            <p:commandButton update="messages" id="btnAgregar" value="Registrar profesor" actionListener="#{regProfesorUI.registrar()}"> </p:commandButton>


        </div>
        </h:form>
    </ui:define>
</ui:composition>
